plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mazsolaklub.hogolyocsata'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mazsolaklub.hogolyocsata'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ''
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
