plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mazsolaklub.szinti'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mazsolaklub.szinti'
        minSdk 28
        targetSdk 36
        versionCode 5
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
