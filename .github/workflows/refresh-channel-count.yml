name: Refresh Mazsola Klub channel count

on:
  push:
    paths:
      - '.github/workflows/refresh-channel-count.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update current YouTube channel count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Több mint 300 magyar gyerekdal, mondóka, népdal-feldolgozás és saját játék a Mazsola Klubban.': '269 videó, gyerekdalok, mondókák, népdal-feldolgozások és saját játékok a Mazsola Klubban.',
              'Több mint 300 magyar gyerekdal, mondóka, népdal-feldolgozás és saját játék szülőknek, óvodáknak és bölcsődéknek.': '269 videó, gyerekdalok, mondókák, népdal-feldolgozások és saját játékok szülőknek, óvodáknak és bölcsődéknek.',
              'Több mint 300 magyar gyerekdal, mondóka, népdal-feldolgozás és saját játék egy helyen.': '269 videó, gyerekdalok, mondókák, népdal-feldolgozások és saját játékok egy helyen.',
              'Több mint 300 videó, klasszikus mondókák és népdalok új köntösben, saját dalok és játékok.': '269 videó, klasszikus mondókák és népdalok új köntösben, saját dalok és játékok.',
              'Több mint 300 videó a csatornáról': '269 videó a csatornáról',
              '<strong>300+</strong><span>videó a csatornán</span>': '<strong>269</strong><span>videó a csatornán</span>',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh website for current 269-video channel"
          git push
