name: Build Mazsola Klub Szinti APK

on:
  push:
    branches: [ android-szinti ]
    paths:
      - 'android-szinti/**'
      - '.github/workflows/build-szinti-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build logo assets
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p android-szinti/app/src/main/res/drawable-nodpi
          ffmpeg -y \
            -i assets/logo-animation.mp4 \
            -f lavfi -i color=c=white:s=320x320:d=8 \
            -filter_complex "[0:v]fps=10,crop=872:872:524:114,scale=320:320,format=rgba[v];[1:v]format=gray,geq=lum='if(lte((X-W/2)*(X-W/2)+(Y-H/2)*(Y-H/2),(W/2-3)*(W/2-3)),255,0)'[m];[v][m]alphamerge[out]" \
            -map "[out]" -t 8 -c:v libwebp_anim -q:v 58 -loop 0 -an \
            android-szinti/app/src/main/res/drawable-nodpi/logo_anim.webp
          ffmpeg -y \
            -ss 0.15 -i assets/logo-animation.mp4 \
            -f lavfi -i color=c=white:s=320x320:d=1 \
            -filter_complex "[0:v]crop=872:872:524:114,scale=320:320,format=rgba[v];[1:v]format=gray,geq=lum='if(lte((X-W/2)*(X-W/2)+(Y-H/2)*(Y-H/2),(W/2-3)*(W/2-3)),255,0)'[m];[v][m]alphamerge[out]" \
            -map "[out]" -frames:v 1 \
            android-szinti/app/src/main/res/drawable-nodpi/logo_static.png

      - name: Build debug APK
        working-directory: android-szinti
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Smoke test app launch on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            adb install -r android-szinti/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.mazsolaklub.szinti/.MainActivity
            START_RC=$?
            sleep 6
            PID=$(adb shell pidof com.mazsolaklub.szinti | tr -d '\r')
            adb logcat -d -t 2500 > /tmp/mazsola-logcat.txt
            echo "===== MAZSOLA APP LOGCAT ====="
            grep -E -A 80 -B 20 "AndroidRuntime|FATAL EXCEPTION|com.mazsolaklub.szinti|has died|ANR in" /tmp/mazsola-logcat.txt || tail -250 /tmp/mazsola-logcat.txt
            echo "===== END LOGCAT ====="
            echo "PID=$PID START_RC=$START_RC"
            if [ "$START_RC" -ne 0 ] || [ -z "$PID" ]; then exit 1; fi
            adb shell dumpsys activity activities | grep -q "com.mazsolaklub.szinti/.MainActivity" || exit 1
            if grep -E "FATAL EXCEPTION|Process: com.mazsolaklub.szinti.*has died|ANR in com.mazsolaklub.szinti" /tmp/mazsola-logcat.txt; then exit 1; fi
            exit 0

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mazsola-klub-szinti-stable-apk
          path: android-szinti/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
