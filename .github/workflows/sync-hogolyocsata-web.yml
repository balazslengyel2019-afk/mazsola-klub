name: Sync Hógolyócsata Android 1.5 gameplay to web
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-hogolyocsata-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact Android 1.5 gameplay using original source patcher
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          mkdir -p android-hogolyocsata/app/src/main/assets/game/assets
          mkdir -p android-hogolyocsata/app/src/main/res/drawable-nodpi
          cp -a hogolyocsata/game/. android-hogolyocsata/app/src/main/assets/game/
          python3 android-hogolyocsata/prepare_game.py
          test -s android-hogolyocsata/app/src/main/assets/game/game.js
          node --check android-hogolyocsata/app/src/main/assets/game/game.js
          node android-hogolyocsata/test-progress.js android-hogolyocsata/app/src/main/assets/game/game.js
      - name: Deploy equivalent browser game with cache-busting
        shell: bash
        run: |
          set -euo pipefail
          cp android-hogolyocsata/app/src/main/assets/game/game.js hogolyocsata/game/game.js
          cp android-hogolyocsata/app/src/main/assets/game/styles.css hogolyocsata/game/styles.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path("hogolyocsata/game/index.html")
          html=p.read_text(encoding="utf-8")
          html=html.replace('href="styles.css"','href="styles.css?v=android15"')
          html=html.replace('src="game.js"','src="game.js?v=android15"')
          p.write_text(html,encoding="utf-8")
          PY
          node --check hogolyocsata/game/game.js
          node android-hogolyocsata/test-progress.js hogolyocsata/game/game.js
          git config user.name "Mazsola Klub Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hogolyocsata/game/game.js hogolyocsata/game/styles.css hogolyocsata/game/index.html
          if git diff --cached --quiet; then
            echo "Web game is already synchronized with Android v1.5"
            exit 0
          fi
          git commit -m "Publish Hógolyócsata web v1.5, matching Android game logic"
          git push
