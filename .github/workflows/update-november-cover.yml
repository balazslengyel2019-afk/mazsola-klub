name: Update Mazsola Klub November hero video

on:
  push:
    paths:
      - ".github/workflows/update-november-cover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download the supplied November animation
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 "https://at.adobe.com/WlmxVyW4nThp1HJL" -o /tmp/mazsola-november-source.mp4
          file /tmp/mazsola-november-source.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration,codec_name -of default=noprint_wrappers=1 /tmp/mazsola-november-source.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 /tmp/mazsola-november-source.mp4)" = "1920"

      - name: Remove audio and keep the original video quality
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -nostdin -v error -y -i /tmp/mazsola-november-source.mp4 -map 0:v:0 -c:v copy -an -movflags +faststart assets/hero-november-2026.mp4
          test "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 assets/hero-november-2026.mp4 | wc -l)" -eq 0
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '/assets/hero-autumn-2026.mp4'
          new = '/assets/hero-november-2026.mp4'
          assert old in text
          p.write_text(text.replace(old,new,1), encoding='utf-8')
          PY

      - name: Publish updated hero animation without changing its layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mazsola Klub Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/hero-november-2026.mp4 index.html
          git commit -m "Replace autumn homepage hero with muted November Martin Day animation"
          git push
