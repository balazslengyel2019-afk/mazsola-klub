name: Fix Mazsola homepage video poster flashes

on:
  push:
    paths:
      - ".github/workflows/fix-homepage-video-posters.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-video-posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate matching thumbnails directly from the videos
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=width,height,duration -select_streams v:0 -of default=noprint_wrappers=1 assets/hero-november-2026.mp4
          ffprobe -v error -show_entries stream=width,height,duration -select_streams v:0 -of default=noprint_wrappers=1 assets/logo-animation.mp4
          ffmpeg -nostdin -v error -y -i assets/hero-november-2026.mp4 -frames:v 1 -vf 'scale=1600:-2' -c:v libwebp -quality 85 assets/hero-november-2026-poster.webp
          ffmpeg -nostdin -v error -y -ss 0.15 -i assets/logo-animation.mp4 -frames:v 1 -vf 'scale=960:-2' -c:v libwebp -quality 85 assets/logo-animation-poster.webp
          test -s assets/hero-november-2026-poster.webp
          test -s assets/logo-animation-poster.webp
      - name: Make initial video presentation match final layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          html=p.read_text(encoding="utf-8")
          old='poster="/assets/cover.png" aria-hidden="true"'
          new='poster="/assets/hero-november-2026-poster.webp" aria-hidden="true"'
          assert old in html
          html=html.replace(old,new,1)
          old='preload="none" poster="/assets/logo.png" aria-label="Mazsola Klub animált logó"'
          new='preload="metadata" poster="/assets/logo-animation-poster.webp" aria-label="Mazsola Klub animált logó"'
          assert old in html
          html=html.replace(old,new,1)
          # Reserve both video layouts before their media metadata arrives.
          marker='</head>'
          critical='''<style id="home-video-layout-stability">
          .home-page .cover .hero-cover-video{display:block;width:100%;height:clamp(220px,25vw,315px);object-fit:cover;object-position:50% 49%;border-radius:30px}
          .home-page .welcome-video video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain}
          @media(max-width:620px){.home-page .cover .hero-cover-video{height:190px;border-radius:20px}}
          @media(max-width:420px){.home-page .cover .hero-cover-video{height:172px}}
          </style>'''
          assert marker in html and 'home-video-layout-stability' not in html
          html=html.replace(marker,critical+marker,1)
          p.write_text(html,encoding="utf-8")
          PY
      - name: Publish poster fix and retain existing dimensions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mazsola Klub Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/hero-november-2026-poster.webp assets/logo-animation-poster.webp
          git commit -m "Prevent homepage logo and November cover flash on load"
          git push
