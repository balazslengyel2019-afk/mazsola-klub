name: Build Mazsola Automoso APK

on:
  push:
    branches:
      - automoso-apk-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Android source bundle
        run: |
          mkdir -p buildsrc
          curl -L --fail --retry 3 -o buildsrc/source.zip "https://drive.google.com/uc?export=download&id=1sSv1NC8yEBRRc5Ybohx2gomBfIQcHyhg"
          unzip -q buildsrc/source.zip -d buildsrc
          cp -a buildsrc/v14build ./automoso-android

      - name: Prepare bundled web assets
        run: |
          mkdir -p automoso-android/app/src/main/assets/www
          mkdir -p automoso-android/app/src/main/res/drawable
          cp -a automoso-android/www/. automoso-android/app/src/main/assets/www/
          cp automoso-android/www/assets/app-icon.png automoso-android/app/src/main/res/drawable/app_icon.png

      - name: Verify v1.4 bundle
        run: |
          test "$(find automoso-android/app/src/main/assets/www/assets/audio/horns -name '*.wav' | wc -l)" -eq 30
          test -f automoso-android/app/src/main/assets/www/assets/garage-v13.jpg
          test -f automoso-android/app/src/main/assets/www/assets/logo-original.png
          test -f automoso-android/app/src/main/assets/www/assets/app-icon.png
          grep -q "versionName '1.4'" automoso-android/app/build.gradle
          grep -q "versionCode 5" automoso-android/app/build.gradle
          test "$(grep -o "threshold:.96" automoso-android/app/src/main/assets/www/app.js | wc -l)" -eq 4
          grep -q "vehicle-carousel" automoso-android/app/src/main/assets/www/index.html
          grep -q "carouselSwipeStart" automoso-android/app/src/main/assets/www/app.js
          grep -q "introVideo.classList.add('ready')" automoso-android/app/src/main/assets/www/app.js
          ! grep -q "vehicle-name" automoso-android/app/src/main/assets/www/index.html

      - name: Build debug APK
        working-directory: automoso-android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp automoso-android/app/build/outputs/apk/debug/app-debug.apk Mazsola-Klub-Moso-v1.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mazsola-Klub-Moso-v1.4
          path: Mazsola-Klub-Moso-v1.4.apk
          retention-days: 30
