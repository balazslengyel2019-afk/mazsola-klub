name: Build Mazsola Automoso APK

on:
  push:
    branches:
      - automoso-apk-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download v2.0 Android source bundle
        run: |
          python -m pip install --disable-pip-version-check gdown
          mkdir -p buildsrc
          gdown "https://drive.google.com/uc?id=1NhNF4W46ySZlAFj8wcLS2S9Dc-qCh2Ni" -O buildsrc/source.zip
          unzip -q buildsrc/source.zip -d buildsrc
          cp -a buildsrc/v20build ./automoso-android

      - name: Prepare bundled web assets
        run: |
          rm -rf automoso-android/app/src/main/assets/www
          mkdir -p automoso-android/app/src/main/assets/www
          mkdir -p automoso-android/app/src/main/res/drawable
          cp -a automoso-android/www/. automoso-android/app/src/main/assets/www/
          cp automoso-android/www/assets/app-icon.png automoso-android/app/src/main/res/drawable/app_icon.png

      - name: Verify v2.0 bundle
        run: |
          test "$(find automoso-android/app/src/main/assets/www/assets/audio/horns -name '*.wav' | wc -l)" -eq 30
          test "$(find automoso-android/app/src/main/assets/www/assets/vehicles -name '*.png' | wc -l)" -eq 30
          test "$(grep -o "asset:'assets/vehicles/" automoso-android/app/src/main/assets/www/app.js | wc -l)" -eq 30
          grep -q "versionName '2.0'" automoso-android/app/build.gradle
          grep -q "versionCode 8" automoso-android/app/build.gradle
          grep -q -- "--vehicle-vw" automoso-android/app/src/main/assets/www/app.js
          grep -q "bottom: 26.2vh" automoso-android/app/src/main/assets/www/styles.css
          grep -q "vehicleSelectGlowV20" automoso-android/app/src/main/assets/www/styles.css

      - name: Build debug APK
        working-directory: automoso-android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp automoso-android/app/build/outputs/apk/debug/app-debug.apk Mazsola-Klub-Moso-v2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mazsola-Klub-Moso-v2.0
          path: Mazsola-Klub-Moso-v2.0.apk
          retention-days: 30
