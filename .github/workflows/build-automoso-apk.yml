name: Build Mazsola Automoso APK

on:
  push:
    branches:
      - automoso-apk-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download v2.3 Android source bundle
        run: |
          python -m pip install --disable-pip-version-check gdown pillow
          mkdir -p buildsrc
          gdown "https://drive.google.com/uc?id=1spg-RE5Ya9aJT_ZEtDKdrn-mV3rLyvnI" -O buildsrc/source.zip
          unzip -q buildsrc/source.zip -d buildsrc
          cp -a buildsrc/v23build ./automoso-android

      - name: Prepare bundled web assets
        run: |
          rm -rf automoso-android/app/src/main/assets/www
          mkdir -p automoso-android/app/src/main/assets/www
          mkdir -p automoso-android/app/src/main/res/drawable
          cp -a automoso-android/www/. automoso-android/app/src/main/assets/www/
          cp automoso-android/www/assets/app-icon.png automoso-android/app/src/main/res/drawable/app_icon.png

      - name: Verify v2.3 bundle
        run: |
          test "$(find automoso-android/app/src/main/assets/www/assets/audio/horns -name '*.wav' | wc -l)" -eq 30
          test "$(find automoso-android/app/src/main/assets/www/assets/vehicles -name '*.png' | wc -l)" -eq 30
          test "$(grep -o "asset:'assets/vehicles/" automoso-android/app/src/main/assets/www/app.js | wc -l)" -eq 30
          test -f automoso-android/app/src/main/assets/www/assets/cloud.png
          test -f automoso-android/app/src/main/assets/www/assets/plane.png
          grep -q "versionName '2.3'" automoso-android/app/build.gradle
          grep -q "versionCode 11" automoso-android/app/build.gradle
          grep -q "FASTEST_TIME_KEY" automoso-android/app/src/main/assets/www/app.js
          grep -q "timerDisplay" automoso-android/app/src/main/assets/www/app.js
          grep -q "startWashTimer" automoso-android/app/src/main/assets/www/app.js
          grep -q "bestTimeValue" automoso-android/app/src/main/assets/www/index.html
          grep -q "selector-plane" automoso-android/app/src/main/assets/www/index.html
          grep -q "vehicleSelectGlowV23" automoso-android/app/src/main/assets/www/styles.css
          grep -q "rgba(255,88,190,.22)" automoso-android/app/src/main/assets/www/app.js
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("automoso-android/app/src/main/assets/www/assets/vehicles")
          files=list(p.glob("*.png"))
          assert len(files)==30
          bad=[]
          for f in files:
              if Image.open(f).size != (1600,900):
                  bad.append((f.name,Image.open(f).size))
          assert not bad, bad
          cloud=Image.open("automoso-android/app/src/main/assets/www/assets/cloud.png")
          plane=Image.open("automoso-android/app/src/main/assets/www/assets/plane.png")
          assert cloud.mode in ("RGBA","LA","P")
          assert plane.mode in ("RGBA","LA","P")
          print("v2.3 verified: timer + best time + plane + blue glow + pink foam.")
          PY

      - name: Build debug APK
        working-directory: automoso-android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp automoso-android/app/build/outputs/apk/debug/app-debug.apk Mazsola-Klub-Moso-v2.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mazsola-Klub-Moso-v2.3
          path: Mazsola-Klub-Moso-v2.3.apk
          retention-days: 30
