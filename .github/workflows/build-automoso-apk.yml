name: Build Mazsola Automoso APK

on:
  push:
    branches:
      - automoso-apk-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download v2.5 Android source bundle
        run: |
          python -m pip install --disable-pip-version-check gdown pillow
          mkdir -p buildsrc
          gdown "https://drive.google.com/uc?id=1Rs90lsHWLSZtJUZMpvuMX3BSDboB2FMy" -O buildsrc/source.zip
          unzip -q buildsrc/source.zip -d buildsrc
          cp -a buildsrc/v25build ./automoso-android

      - name: Prepare bundled web assets
        run: |
          rm -rf automoso-android/app/src/main/assets/www
          mkdir -p automoso-android/app/src/main/assets/www
          mkdir -p automoso-android/app/src/main/res/drawable
          cp -a automoso-android/www/. automoso-android/app/src/main/assets/www/
          cp automoso-android/www/assets/app-icon.png automoso-android/app/src/main/res/drawable/app_icon.png

      - name: Verify v2.5 bundle
        run: |
          test "$(find automoso-android/app/src/main/assets/www/assets/audio/horns -name '*.wav' | wc -l)" -eq 30
          test "$(find automoso-android/app/src/main/assets/www/assets/vehicles -name '*.png' | wc -l)" -eq 30
          test "$(grep -o "asset:'assets/vehicles/" automoso-android/app/src/main/assets/www/app.js | wc -l)" -eq 30
          test -f automoso-android/app/src/main/assets/www/assets/cloud.png
          test -f automoso-android/app/src/main/assets/www/assets/plane.png
          test -f automoso-android/app/src/main/assets/www/assets/hot-air-balloon.png
          grep -q "versionName '2.5'" automoso-android/app/build.gradle
          grep -q "versionCode 13" automoso-android/app/build.gradle
          grep -q "FASTEST_TIME_KEYS" automoso-android/app/src/main/assets/www/app.js
          grep -q "updateBestTimeUI" automoso-android/app/src/main/assets/www/app.js
          grep -q "version-badge" automoso-android/app/src/main/assets/www/index.html
          grep -q "drop-shadow(5px 0 0 #fff)" automoso-android/app/src/main/assets/www/styles.css
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("automoso-android/app/src/main/assets/www/assets/vehicles")
          files=list(p.glob("*.png"))
          assert len(files)==30
          bad=[]
          for f in files:
              if Image.open(f).size != (1600,900):
                  bad.append((f.name,Image.open(f).size))
          assert not bad, bad
          for name in ("combine.png","crane-truck.png"):
              im=Image.open(p/name)
              assert im.size == (1600,900)
              assert im.mode in ("RGBA","LA","P")
          print("v2.5 verified: white outline + best time visibility + refreshed combine/crane + version badge.")
          PY

      - name: Build debug APK
        working-directory: automoso-android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp automoso-android/app/build/outputs/apk/debug/app-debug.apk Mazsola-Klub-Moso-v2.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mazsola-Klub-Moso-v2.5
          path: Mazsola-Klub-Moso-v2.5.apk
          retention-days: 30
