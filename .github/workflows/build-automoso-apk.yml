name: Build Mazsola Automoso APK

on:
  push:
    branches:
      - automoso-apk-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download v1.4 Android source bundle
        run: |
          mkdir -p buildsrc
          curl -L --fail --retry 3 -o buildsrc/source.zip "https://drive.google.com/uc?export=download&id=1sSv1NC8yEBRRc5Ybohx2gomBfIQcHyhg"
          unzip -q buildsrc/source.zip -d buildsrc
          cp -a buildsrc/v14build ./automoso-android

      - name: Apply v1.5 changes
        run: |
          python .github/v15/apply_v15.py automoso-android
          cat .github/v15/v15.css >> automoso-android/www/styles.css
          curl -L --fail --retry 3 -o automoso-android/www/assets/fomenu.jpg "https://drive.google.com/uc?export=download&id=1Cfmm1Tp7xFiBrmOORIMAyohWJ0QUpo_l"
          curl -L --fail --retry 3 -o automoso-android/www/assets/garazs.jpg "https://drive.google.com/uc?export=download&id=1jkZ0WGigcq2r6pE7Q5TaxYS9eNeQwBh6"

      - name: Prepare bundled web assets
        run: |
          mkdir -p automoso-android/app/src/main/assets/www
          mkdir -p automoso-android/app/src/main/res/drawable
          cp -a automoso-android/www/. automoso-android/app/src/main/assets/www/
          cp automoso-android/www/assets/app-icon.png automoso-android/app/src/main/res/drawable/app_icon.png

      - name: Verify v1.5 bundle
        run: |
          test "$(find automoso-android/app/src/main/assets/www/assets/audio/horns -name '*.wav' | wc -l)" -eq 30
          test -f automoso-android/app/src/main/assets/www/assets/fomenu.jpg
          test -f automoso-android/app/src/main/assets/www/assets/garazs.jpg
          test -f automoso-android/app/src/main/assets/www/assets/garage-v13.jpg
          grep -q "versionName '1.5'" automoso-android/app/build.gradle
          grep -q "versionCode 6" automoso-android/app/build.gradle
          test "$(grep -o "threshold:.96" automoso-android/app/src/main/assets/www/app.js | wc -l)" -eq 4
          grep -q "const centerX = W / 2;" automoso-android/app/src/main/assets/www/app.js
          grep -q "const step = Math.max(340, vw);" automoso-android/app/src/main/assets/www/app.js
          grep -q "const exitPx = (vw / 2) + (cardWidth / 2) + 80;" automoso-android/app/src/main/assets/www/app.js
          grep -q "assets/fomenu.jpg" automoso-android/app/src/main/assets/www/styles.css
          grep -q "assets/garazs.jpg" automoso-android/app/src/main/assets/www/styles.css
          grep -q 'class="back-button select-back-button"' automoso-android/app/src/main/assets/www/index.html

      - name: Build debug APK
        working-directory: automoso-android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp automoso-android/app/build/outputs/apk/debug/app-debug.apk Mazsola-Klub-Moso-v1.5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mazsola-Klub-Moso-v1.5
          path: Mazsola-Klub-Moso-v1.5.apk
          retention-days: 30
